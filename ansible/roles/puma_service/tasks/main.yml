---
- name: Write Puma systemd service unit
  template:
    src: puma.service.j2
    dest: /etc/systemd/system/puma.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd

- name: Enable Puma service (do not start — app not yet deployed)
  systemd:
    name: puma
    enabled: yes
    daemon_reload: yes
