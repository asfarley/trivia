---
- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Write trivia Nginx site config
  template:
    src: trivia.conf.j2
    dest: /etc/nginx/sites-available/trivia
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable trivia Nginx site
  file:
    src: /etc/nginx/sites-available/trivia
    dest: /etc/nginx/sites-enabled/trivia
    state: link
  notify: reload nginx

- name: Validate Nginx configuration
  command: nginx -t
  changed_when: false

- name: Start and enable Nginx
  service:
    name: nginx
    state: started
    enabled: yes
